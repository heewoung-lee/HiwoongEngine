<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">HiwoongEngine 컴포넌트 조립 구조</title>
  <desc id="desc">GameObject가 기본 Transform과 선택적인 기능 컴포넌트를 조립하고 생명주기를 전달하는 구조</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081018"/><stop offset="1" stop-color="#151827"/></linearGradient>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker>
    <style>.t{font:700 30px 'Segoe UI','Noto Sans KR',sans-serif;fill:#f8fafc}.s{font:400 16px 'Segoe UI','Noto Sans KR',sans-serif;fill:#94a3b8}.h{font:700 20px 'Segoe UI','Noto Sans KR',sans-serif;fill:#f8fafc}.b{font:400 15px 'Segoe UI','Noto Sans KR',sans-serif;fill:#cbd5e1}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a3)}</style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg3)"/>
  <text x="58" y="60" class="t">기능을 상속으로 쌓지 않고, Component로 조립합니다</text>
  <text x="58" y="91" class="s">같은 GameObject라도 어떤 Component를 붙이느냐에 따라 역할이 달라집니다.</text>
  <rect x="55" y="145" width="330" height="360" rx="22" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
  <text x="220" y="190" text-anchor="middle" class="h">GameObject</text>
  <text x="220" y="220" text-anchor="middle" class="b">Component 목록을 소유</text>
  <rect x="88" y="255" width="264" height="78" rx="14" fill="#083344" stroke="#22d3ee"/>
  <text x="220" y="286" text-anchor="middle" class="h">TransformComponent</text>
  <text x="220" y="313" text-anchor="middle" class="b">모든 객체에 기본 생성</text>
  <rect x="88" y="352" width="264" height="105" rx="14" fill="#0f172a" stroke="#475569" stroke-dasharray="7 5"/>
  <text x="220" y="384" text-anchor="middle" class="h">선택 Component</text>
  <text x="220" y="411" text-anchor="middle" class="b">AddComponent&lt;T&gt;()</text>
  <text x="220" y="438" text-anchor="middle" class="b">필요한 기능만 추가</text>
  <path d="M395 325 H470" class="line"/>
  <rect x="490" y="130" width="650" height="390" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="815" y="174" text-anchor="middle" class="h">서로 다른 조립 결과</text>
  <rect x="530" y="210" width="270" height="115" rx="16" fill="#3b0764" stroke="#c084fc"/>
  <text x="665" y="246" text-anchor="middle" class="h">보이는 객체</text><text x="665" y="275" text-anchor="middle" class="b">Transform + SpriteRenderer</text><text x="665" y="300" text-anchor="middle" class="b">문자 · 색상 · 정렬 순서</text>
  <rect x="830" y="210" width="270" height="115" rx="16" fill="#052e16" stroke="#4ade80"/>
  <text x="965" y="246" text-anchor="middle" class="h">조작 가능한 객체</text><text x="965" y="275" text-anchor="middle" class="b">Transform + Input</text><text x="965" y="300" text-anchor="middle" class="b">키 입력에 따라 행동</text>
  <rect x="530" y="355" width="270" height="115" rx="16" fill="#422006" stroke="#fbbf24"/>
  <text x="665" y="391" text-anchor="middle" class="h">UI 객체</text><text x="665" y="420" text-anchor="middle" class="b">Transform + SpriteRenderer</text><text x="665" y="445" text-anchor="middle" class="b">같은 부품을 다른 목적으로 사용</text>
  <rect x="830" y="355" width="270" height="115" rx="16" fill="#450a0a" stroke="#f87171"/>
  <text x="965" y="391" text-anchor="middle" class="h">사용자 정의 객체</text><text x="965" y="420" text-anchor="middle" class="b">Transform + Custom Component</text><text x="965" y="445" text-anchor="middle" class="b">게임 규칙을 엔진 밖에서 확장</text>
  <rect x="92" y="552" width="1016" height="42" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="600" y="579" text-anchor="middle" class="b">GameObject가 Start · Update · Draw를 전달하고, Component는 weak_ptr로 자신의 주인을 조회합니다.</text>
</svg>
