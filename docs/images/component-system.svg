<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">테트리스 조각의 컴포넌트 구조</title>
  <desc id="desc">부모 TetrisModule은 입력을 담당하고 네 개의 자식 Block은 각자 화면 출력을 담당하는 구조</desc>
  <defs><linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081018"/><stop offset="1" stop-color="#151827"/></linearGradient><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.t{font:700 30px 'Segoe UI','Noto Sans KR',sans-serif;fill:#f8fafc}.s{font:400 16px 'Segoe UI','Noto Sans KR',sans-serif;fill:#94a3b8}.h{font:700 20px 'Segoe UI','Noto Sans KR',sans-serif;fill:#f8fafc}.b{font:400 15px 'Segoe UI','Noto Sans KR',sans-serif;fill:#cbd5e1}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a3)}</style></defs>
  <rect width="1200" height="600" rx="24" fill="url(#bg3)"/>
  <text x="58" y="60" class="t">부모는 조작하고, 네 개의 자식은 각자 그립니다</text>
  <text x="58" y="91" class="s">GameObject마다 필요한 Component만 붙여 하나의 테트리스 조각을 만듭니다.</text>
  <rect x="70" y="155" width="400" height="285" rx="22" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
  <text x="270" y="203" text-anchor="middle" class="h">TetrisModule (부모 GameObject)</text>
  <rect x="105" y="235" width="330" height="74" rx="14" fill="#083344" stroke="#22d3ee"/>
  <text x="270" y="265" text-anchor="middle" class="h">TransformComponent</text>
  <text x="270" y="291" text-anchor="middle" class="b">조각 전체의 위치 · 부모 좌표</text>
  <rect x="105" y="330" width="330" height="74" rx="14" fill="#052e16" stroke="#4ade80"/>
  <text x="270" y="360" text-anchor="middle" class="h">PlayerInputComponent</text>
  <text x="270" y="386" text-anchor="middle" class="b">이동 · 회전 · 즉시 낙하</text>
  <path d="M480 297 H565" class="line"/>
  <rect x="585" y="135" width="545" height="325" rx="24" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
  <text x="857" y="183" text-anchor="middle" class="h">자식 Block GameObject × 4</text>
  <g transform="translate(625 220)">
    <rect width="220" height="85" rx="14" fill="#083344" stroke="#22d3ee"/>
    <text x="110" y="34" text-anchor="middle" class="h">Transform</text><text x="110" y="62" text-anchor="middle" class="b">각 칸의 로컬 위치</text>
    <rect x="245" width="220" height="85" rx="14" fill="#3b0764" stroke="#c084fc"/>
    <text x="355" y="34" text-anchor="middle" class="h">SpriteRenderer</text><text x="355" y="62" text-anchor="middle" class="b">@ 문자 · 색상 출력</text>
  </g>
  <g fill="none" stroke="#22d3ee" stroke-width="4"><rect x="791" y="340" width="35" height="35"/><rect x="829" y="340" width="35" height="35"/><rect x="867" y="340" width="35" height="35"/><rect x="829" y="378" width="35" height="35"/></g>
  <text x="857" y="438" text-anchor="middle" class="b">부모가 움직이면 네 자식도 함께 이동</text>
  <rect x="92" y="485" width="1016" height="58" rx="14" fill="#0f172a" stroke="#334155"/>
  <text x="600" y="520" text-anchor="middle" class="b">각 Component는 Start · Update · Draw 생명주기를 받고, 자신의 주인 GameObject를 조회할 수 있습니다.</text>
</svg>
