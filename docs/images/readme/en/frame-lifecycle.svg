<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">HiwoongEngine frame lifecycle</title>
  <desc id="desc">The frame sequence: input, scene initialization, Start, Update, Draw, scene transition, and pending object changes.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" x2="1"><stop stop-color="#081018"/><stop offset="1" stop-color="#131827"/></linearGradient>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker>
    <style>.t{font:700 30px 'Segoe UI','Noto Sans KR',sans-serif;fill:#f8fafc}.s{font:400 16px 'Segoe UI','Noto Sans KR',sans-serif;fill:#94a3b8}.n{font:700 14px 'Segoe UI',sans-serif;fill:#081018}.h{font:700 18px 'Segoe UI','Noto Sans KR',sans-serif;fill:#f8fafc}.b{font:400 13px 'Segoe UI','Noto Sans KR',sans-serif;fill:#cbd5e1}.a{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arr2)}</style>
  </defs>
  <rect width="1400" height="430" rx="24" fill="url(#bg2)"/>
  <text x="54" y="58" class="t">The game repeats these steps every frame</text>
  <text x="54" y="88" class="s">Initialize and Start run only when needed.</text>
  <g transform="translate(45 145)">
    <g><circle cx="56" cy="0" r="19" fill="#67e8f9"/><text x="56" y="5" text-anchor="middle" class="n">1</text><rect x="0" y="35" width="150" height="100" rx="16" fill="#083344" stroke="#22d3ee"/><text x="75" y="73" text-anchor="middle" class="h">Input</text><text x="75" y="100" text-anchor="middle" class="b">Read input state</text></g>
    <path d="M155 85 H185" class="a"/>
    <g transform="translate(195)"><circle cx="56" cy="0" r="19" fill="#86efac"/><text x="56" y="5" text-anchor="middle" class="n">2</text><rect x="0" y="35" width="150" height="100" rx="16" fill="#052e16" stroke="#4ade80"/><text x="75" y="73" text-anchor="middle" class="h">Initialize</text><text x="75" y="100" text-anchor="middle" class="b">Prepare a new scene</text></g>
    <path d="M350 85 H380" class="a"/>
    <g transform="translate(390)"><circle cx="56" cy="0" r="19" fill="#fde68a"/><text x="56" y="5" text-anchor="middle" class="n">3</text><rect x="0" y="35" width="150" height="100" rx="16" fill="#422006" stroke="#fbbf24"/><text x="75" y="73" text-anchor="middle" class="h">Start</text><text x="75" y="100" text-anchor="middle" class="b">Run once per object</text></g>
    <path d="M545 85 H575" class="a"/>
    <g transform="translate(585)"><circle cx="56" cy="0" r="19" fill="#f9a8d4"/><text x="56" y="5" text-anchor="middle" class="n">4</text><rect x="0" y="35" width="150" height="100" rx="16" fill="#500724" stroke="#f472b6"/><text x="75" y="73" text-anchor="middle" class="h">Update</text><text x="75" y="100" text-anchor="middle" class="b">Move · game rules</text></g>
    <path d="M740 85 H770" class="a"/>
    <g transform="translate(780)"><circle cx="56" cy="0" r="19" fill="#c4b5fd"/><text x="56" y="5" text-anchor="middle" class="n">5</text><rect x="0" y="35" width="150" height="100" rx="16" fill="#2e1065" stroke="#a78bfa"/><text x="75" y="73" text-anchor="middle" class="h">Draw</text><text x="75" y="100" text-anchor="middle" class="b">Collect draw calls</text></g>
    <path d="M935 85 H965" class="a"/>
    <g transform="translate(975)"><circle cx="56" cy="0" r="19" fill="#93c5fd"/><text x="56" y="5" text-anchor="middle" class="n">6</text><rect x="0" y="35" width="150" height="100" rx="16" fill="#172554" stroke="#60a5fa"/><text x="75" y="73" text-anchor="middle" class="h">Transition</text><text x="75" y="100" text-anchor="middle" class="b">Switch scenes</text></g>
    <path d="M1130 85 H1160" class="a"/>
    <g transform="translate(1170)"><circle cx="56" cy="0" r="19" fill="#fdba74"/><text x="56" y="5" text-anchor="middle" class="n">7</text><rect x="0" y="35" width="150" height="100" rx="16" fill="#431407" stroke="#fb923c"/><text x="75" y="73" text-anchor="middle" class="h">Commit</text><text x="75" y="100" text-anchor="middle" class="b">Add · remove objects</text></g>
  </g>
  <path d="M1290 315 C1290 380 110 380 110 315" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" fill="none" marker-end="url(#arr2)"/>
  <text x="700" y="404" text-anchor="middle" class="s">Return to the next frame and repeat</text>
</svg>
